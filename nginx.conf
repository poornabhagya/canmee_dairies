# 1. Backend එක හඳුන්වා දීම
# අපේ Gunicorn (Web Container) එක තියෙන තැන සහ පෝට් එක (8000) Nginx එකට හඳුන්වා දෙනවා.
upstream django_upstream {
    server web:8000;
}

# 2. HTTP ඉඳන් HTTPS වලට හරවා යැවීම (Auto Redirect)
# කවුරුහරි http:// (Port 80) හරහා ආවොත්, එයාව කෙළින්ම ආරක්ෂිත https:// එකට හරවලා යවනවා.
server {
    listen 80;
    server_name canmeedairies.lk admin.canmeedairies.lk;
    return 301 https://$host$request_uri;
}

# 3. ප්‍රධාන HTTPS (Port 443) සර්වර් සැකසුම
server {
    listen 443 ssl http2;
    server_name canmeedairies.lk admin.canmeedairies.lk;

    # SSL සහතික (Certificates) තියෙන තැන (මෙවා Phase 8.2 වලදී අපි ඔටෝ ජෙනරේට් කරනවා)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    
    # පරණ අනාරක්ෂිත ක්‍රම ඉවත් කර, ඉතා ආරක්ෂිත TLS 1.2 සහ 1.3 පමණක් භාවිතා කිරීම
    ssl_protocols TLSv1.2 TLSv1.3;

    # 4. Security Headers (හැකර්වරුන්ගෙන් බේරීමට Phase 3.5 හි නියම කර ඇති පරිදි)
    # බ්‍රව්සර් එක රවට්ටලා වෙනත් ෆයිල් ජාති (MIME sniffing) රන් කරන එක වැළැක්වීම
    add_header X-Content-Type-Options "nosniff" always; 
    # වෙනත් හොර සයිට් එකක් ඇතුළේ අපේ සයිට් එක iframe එකක් විදියට ලෝඩ් කිරීම (Clickjacking) වැළැක්වීම
    add_header X-Frame-Options "DENY" always; 
    # HSTS: අවුරුද්දක් යනකම් (max-age) මේ සයිට් එකට එන්න ඕනේ HTTPS වලින්ම විතරයි කියලා බ්‍රව්සර් එකට නියෝග කිරීම
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; 

    # 5. Static සහ Media ෆයිල්ස් වේගවත්ව යැවීම
    # CSS, JS වගේ static ෆයිල්ස් Django එකට නොයා කෙළින්ම Nginx හරහා යැවීම
    location /static/ {
        alias /var/www/static/;
        expires 30d; # දින 30ක් යනකම් පාරිභෝගිකයාගේ බ්‍රව්සර් එකේ මේවා සේව් කරන් (Cache) තියාගන්න දෙනවා
    }

    # පින්තූර සහ අප්ලෝඩ් කරන ෆයිල්ස් (Media) යැවීම
    location /media/ {
        alias /var/www/media/;
        expires 7d; # දින 7ක Cache කාලයක් දෙනවා
    }

    # 6. ප්‍රධාන Django App එකට දත්ත යොමු කිරීම
    # අනිත් සියලුම requests (උදා: ලොගින් වීම, දත්ත සේව් කිරීම) Gunicorn (Backend) වෙත යොමු කිරීම
    location / {
        proxy_pass http://django_upstream;
        # සැබෑ පාරිභෝගිකයාගේ IP එක සහ විස්තර අතුරුදන් නොවී Backend එකට යැවීමට headers සෙට් කිරීම
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Request එක ආවේ HTTPS හරහා බව Django එකට දැනුම් දීම
    }
}