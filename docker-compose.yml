version: "3.8"

services:
  # 1. Database Service (MariaDB 10.11 LTS)
  mariadb:
    image: mariadb:10.11
    container_name: canmee_mariadb
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --max-connections=100
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # ports:
    #   - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 500M
    networks:
      - canmee_net

  # 2. Redis Cache Service (Redis 7.2 Alpine)
  redis:
    image: redis:7.2-alpine
    container_name: canmee_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    deploy:
      resources:
        limits:
          memory: 200M
    networks:
      - canmee_net

  # 3. Backend Web Service (Django + Gunicorn)
  web:
    image: 804372444724.dkr.ecr.ap-south-1.amazonaws.com/canmee-dairies-erp:staging
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canmee_web
    restart: unless-stopped
    depends_on:
      - mariadb
      - redis
    env_file: .env
    environment:
      - DB_HOST=mariadb
    command: gunicorn canmee_dairies.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --worker-class gthread --timeout 60 --max-requests 1000 --max-requests-jitter 100
    volumes:
      - static_data:/app/collected_static
      - media_data:/app/media
    deploy:
      resources:
        limits:
          memory: 1200M
    networks:
      - canmee_net

  # 4. Celery Background Worker Daemon
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canmee_celery
    restart: unless-stopped
    depends_on:
      - mariadb
      - redis
    env_file: .env
    command: celery -A canmee_dairies worker -l INFO --concurrency=2 --max-memory-per-child=200000
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          memory: 600M
    networks:
      - canmee_net

  # 5. Nginx Reverse Proxy Service (TLS 1.3)
  nginx:
    image: nginx:1.25-alpine
    container_name: canmee_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 150M
    networks:
      - canmee_net

volumes:
  mariadb_data:
  static_data:
  media_data:

networks:
  canmee_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16