<div class="modal fade" id="rawMilkResultModal" tabindex="-1" aria-labelledby="rawMilkResultModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" id="rawMilkResultForm" action="">
        {% csrf_token %}
        <input type="hidden" name="next" id="rawMilkResultNext" value="{{ request.get_full_path }}">
        <div class="modal-header">
          <h5 class="modal-title" id="rawMilkResultModalLabel">Supplier result</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3" id="rawMilkResultSubtitle"></p>
          <div id="rawMilkResultFormErrors" class="alert alert-danger d-none" role="alert"></div>
          <div class="mb-3">
            <label class="form-label" for="rawMilkResultQty">Supplier result (quantity)</label>
            <input
              type="number"
              class="form-control"
              name="supplier_result_quantity"
              id="rawMilkResultQty"
              step="0.01"
              min="0"
            >
            <p class="form-text text-muted small mb-0" id="rawMilkResultAvailableQty"></p>
          </div>
          <div class="mb-0">
            <label class="form-label" for="rawMilkResultStatus">Status</label>
            <select class="form-select" name="status" id="rawMilkResultStatus" required>
              {% for code, label in status_choices %}
              <option value="{{ code }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Save result</button>
        </div>
      </form>
    </div>
  </div>
</div>
