{% extends "base.html" %}
{% block title %}Supplier Payment{% endblock %}
{% block page_heading %}Supplier Payment{% endblock %}
{% block content %}
<div class="module-shell">
  <div class="page-header">
    <div>
      <h1 class="page-title">Supplier Payment</h1>
      <p class="page-subtitle">Record debits against supplier payable balance.</p>
    </div>
  </div>
  <div class="module-card form-shell">
    <div class="module-card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Record Payment</button>
        <a href="{% url 'supplier-ledger' %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
