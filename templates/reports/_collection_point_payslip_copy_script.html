<script>
(function () {
  var FONT = "font-family:Arial,Helvetica,sans-serif;";
  var B =
    "border:0.5pt solid #000000;" +
    "border-top:0.5pt solid #000000;" +
    "border-right:0.5pt solid #000000;" +
    "border-bottom:0.5pt solid #000000;" +
    "border-left:0.5pt solid #000000;" +
    "mso-border-alt:solid #000000 .25pt;";
  var NO_B = "border:none;mso-border-alt:none;";
  var CELL = FONT + "font-size:9pt;padding:2px 4px;vertical-align:middle;";
  var TH = CELL + B + "background:#e0e0e0;font-weight:700;text-align:center;text-transform:uppercase;font-size:8pt;";
  var TH_LEFT = TH.replace("text-align:center", "text-align:left");
  var TD = CELL + B;
  var TD_NUM = TD + "text-align:right;mso-number-format:\"\\#\\,\\#\\#0\\.00\";";
  var TITLE = CELL + NO_B + "font-weight:700;text-align:center;font-size:11pt;text-transform:uppercase;";
  var META = CELL + NO_B + "font-size:9pt;";
  var SPACER = CELL + NO_B;
  var LABEL = TD + "font-weight:600;text-transform:uppercase;font-size:8pt;text-align:left;";
  var SHADED = "background:#e0e0e0;";
  var BOLD = "font-weight:700;";
  var MAIN_TABLE =
    'border="0" cellpadding="0" cellspacing="0" class="xl-sheet" ' +
    'style="border-collapse:separate;border-spacing:0;width:520px;mso-table-layout-alt:fixed;"';

  function esc(text) {
    return String(text || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function row(cells) {
    return "<tr>" + cells.join("") + "</tr>";
  }

  function gridCell(tag, style, content) {
    return "<" + tag + ' class="xl-grid" style="' + style + '">' + content + "</" + tag + ">";
  }

  function mergedCell(colspan, style, content) {
    return '<td colspan="' + colspan + '" class="xl-plain" style="' + style + '">' + content + "</td>";
  }

  function mergedRow(colspan, style, content) {
    return row([mergedCell(colspan, style, content)]);
  }

  function getMainSheets() {
    return Array.prototype.slice.call(
      document.querySelectorAll(
        ".payslip-print-a5.payslip-print-lang-en .payslip-a5-point-sheet:not(.payslip-a5-sheet--attachment)"
      )
    );
  }

  function getGoodsSheets() {
    return Array.prototype.slice.call(
      document.querySelectorAll(
        ".payslip-print-a5.payslip-print-lang-en .payslip-a5-sheet--attachment"
      )
    );
  }

  function appendPointHeader(parts, sheet, colspan) {
    var company = sheet.querySelector(".payslip-a5-company");
    if (company) parts.push(mergedRow(colspan, TITLE, esc(company.textContent.trim())));
    var address = sheet.querySelector(".payslip-a5-address");
    if (address) parts.push(mergedRow(colspan, META, esc(address.textContent.trim())));
    var phone = sheet.querySelector(".payslip-a5-phone");
    if (phone) parts.push(mergedRow(colspan, META, esc(phone.textContent.trim())));
    var meta = sheet.querySelector(".payslip-a5-point-meta");
    if (meta) {
      meta.querySelectorAll("tr").forEach(function (tr) {
        parts.push(mergedRow(colspan, META, esc(tr.textContent.trim().replace(/\s+/g, " "))));
      });
    }
  }

  function appendFarmersSection(parts, sheet) {
    parts.push(mergedRow(8, SPACER, "&nbsp;"));
    parts.push(
      row([
        gridCell("th", TH, "No"),
        gridCell("th", TH_LEFT, "Name"),
        gridCell("th", TH, "Kg"),
        gridCell("th", TH, "Ltr"),
        gridCell("th", TH, "Fat"),
        gridCell("th", TH, "Snf"),
        gridCell("th", TH, "Rate"),
        gridCell("th", TH, "Amount"),
      ])
    );
    sheet.querySelectorAll(".payslip-a5-farmers tbody tr").forEach(function (tr) {
      var cells = tr.querySelectorAll("td");
      if (cells.length < 8) return;
      var rowCells = [];
      cells.forEach(function (cell, index) {
        var style = index === 1 ? TD : TD_NUM;
        rowCells.push(gridCell("td", style, esc(cell.textContent.trim() || "—")));
      });
      parts.push(row(rowCells));
    });
  }

  function appendSummarySection(parts, sheet) {
    parts.push(mergedRow(2, SPACER, "&nbsp;"));
    sheet.querySelectorAll(".payslip-a5-farmers tfoot tr, .payslip-a5-summary tbody tr").forEach(function (tr) {
      var label = "";
      var value = "";
      var cells = tr.querySelectorAll("th, td");
      if (!cells.length) return;
      if (cells.length === 2) {
        label = cells[0].textContent.trim();
        value = cells[1].textContent.trim();
      } else {
        label = cells[0].textContent.trim();
        value = cells[cells.length - 1].textContent.trim();
      }
      var shaded = tr.classList.contains("shaded");
      var bold = tr.classList.contains("bold");
      var bg = shaded ? SHADED : "";
      var fw = bold ? BOLD : "font-weight:600;";
      parts.push(
        row([
          gridCell("td", LABEL + bg + fw, esc(label)),
          gridCell("td", TD_NUM + bg + (bold ? BOLD : ""), esc(value)),
        ])
      );
    });
  }

  function appendGoodsAttachment(parts, sheet) {
    var title = sheet.querySelector(".payslip-a5-attachment-title");
    if (title) parts.push(mergedRow(4, META + BOLD, esc(title.textContent.trim())));
    parts.push(
      row([
        gridCell("th", TH_LEFT, "Product"),
        gridCell("th", TH, "Qty"),
        gridCell("th", TH, "Rate"),
        gridCell("th", TH, "Amount"),
      ])
    );
    sheet.querySelectorAll(".payslip-a5-goods-summary tbody tr").forEach(function (tr) {
      var cells = tr.querySelectorAll("td");
      if (cells.length < 4) return;
      parts.push(
        row([
          gridCell("td", TD, esc(cells[0].textContent.trim())),
          gridCell("td", TD_NUM, esc(cells[1].textContent.trim())),
          gridCell("td", TD_NUM, esc(cells[2].textContent.trim())),
          gridCell("td", TD_NUM, esc(cells[3].textContent.trim())),
        ])
      );
    });
    var totalRow = sheet.querySelector(".payslip-a5-goods-summary tfoot tr");
    if (totalRow) {
      var totalCells = totalRow.querySelectorAll("td");
      if (totalCells.length >= 2) {
        parts.push(
          row([
            gridCell("td", LABEL + SHADED + BOLD, esc(totalCells[0].textContent.trim())),
            gridCell("td", TD_NUM + SHADED + BOLD, esc(totalCells[totalCells.length - 1].textContent.trim())),
          ])
        );
      }
    }
  }

  function buildExcelTableFromSheet(sheet, section) {
    section = section || "full";
    var parts = [];
    var colspan = section === "summary" ? 2 : 8;
    parts.push("<table " + MAIN_TABLE + ">");
    if (section !== "summary") {
      appendPointHeader(parts, sheet, colspan);
    }
    if (section === "full" || section === "farmers") {
      appendFarmersSection(parts, sheet);
    }
    if (section === "full" || section === "summary") {
      appendSummarySection(parts, sheet);
    }
    parts.push("</table>");
    return parts.join("");
  }

  function plainFromSheet(sheet, section) {
    section = section || "full";
    var lines = [];
    if (section !== "summary") {
      var company = sheet.querySelector(".payslip-a5-company");
      if (company) lines.push(company.textContent.trim());
      var meta = sheet.querySelector(".payslip-a5-point-meta");
      if (meta) lines.push(meta.textContent.trim().replace(/\s+/g, " "));
      lines.push("");
    }
    if (section === "full" || section === "farmers") {
      var farmers = sheet.querySelector(".payslip-a5-farmers");
      if (farmers) {
        farmers.querySelectorAll("thead tr, tbody tr").forEach(function (tr) {
          var cells = [];
          tr.querySelectorAll("th, td").forEach(function (cell) {
            cells.push(cell.textContent.trim());
          });
          if (cells.length) lines.push(cells.join("\t"));
        });
        lines.push("");
      }
    }
    if (section === "full" || section === "summary") {
      sheet.querySelectorAll(".payslip-a5-farmers tfoot tr, .payslip-a5-summary tbody tr").forEach(function (tr) {
        var cells = tr.querySelectorAll("th, td");
        if (!cells.length) return;
        if (cells.length === 2) {
          lines.push(cells[0].textContent.trim() + "\t" + cells[1].textContent.trim());
        } else {
          lines.push(cells[0].textContent.trim() + "\t" + cells[cells.length - 1].textContent.trim());
        }
      });
      lines.push("");
    }
    return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  function wrapExcelHtml(bodyContent) {
    return (
      '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
      'xmlns:x="urn:schemas-microsoft-com:office:excel" ' +
      'xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8">' +
      "<style>.xl-grid,.xl-grid th{border:0.5pt solid #000 !important;}.xl-plain{border:none !important;}</style>" +
      "</head><body><!--StartFragment-->" + bodyContent + "<!--EndFragment--></body></html>"
    );
  }

  function buildCopyPayload(section) {
    var mainSheets = getMainSheets();
    if (!mainSheets.length) return null;
    var tables = mainSheets.map(function (sheet) {
      return buildExcelTableFromSheet(sheet, section);
    });
    if (section === "full") {
      getGoodsSheets().forEach(function (sheet) {
        var parts = ["<table " + MAIN_TABLE + ">"];
        appendGoodsAttachment(parts, sheet);
        parts.push("</table>");
        tables.push(parts.join(""));
      });
    }
    var html = wrapExcelHtml(tables.join('<br style="mso-data-placement:same-cell;">'));
    var fragmentHtml = html.replace(/^[\s\S]*<!--StartFragment-->/i, "").replace(/<!--EndFragment-->[\s\S]*$/i, "");
    var plain = mainSheets.map(function (sheet) {
      return plainFromSheet(sheet, section);
    }).join("\n\n--------------------\n\n");
    if (section === "full") {
      getGoodsSheets().forEach(function (sheet) {
        plain += "\n\n--------------------\n\n";
        var title = sheet.querySelector(".payslip-a5-attachment-title");
        if (title) plain += title.textContent.trim() + "\n";
        sheet.querySelectorAll(".payslip-a5-goods-summary tr").forEach(function (tr) {
          var cells = [];
          tr.querySelectorAll("th, td").forEach(function (cell) {
            cells.push(cell.textContent.trim());
          });
          if (cells.length) plain += cells.join("\t") + "\n";
        });
      });
    }
    return { html: html, fragmentHtml: fragmentHtml, plain: plain.trim(), count: mainSheets.length };
  }

  function copyRichContent(html, plain, fragmentHtml) {
    return new Promise(function (resolve, reject) {
      var wrapper = document.createElement("div");
      wrapper.contentEditable = "true";
      wrapper.style.cssText = "position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;";
      wrapper.innerHTML = fragmentHtml;
      document.body.appendChild(wrapper);
      var range = document.createRange();
      range.selectNodeContents(wrapper);
      var selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      function onCopy(e) {
        e.clipboardData.setData("text/plain", plain);
      }
      document.addEventListener("copy", onCopy);
      var ok = false;
      try {
        ok = document.execCommand("copy");
      } catch (err) {
        document.removeEventListener("copy", onCopy);
        document.body.removeChild(wrapper);
        selection.removeAllRanges();
        reject(err);
        return;
      }
      document.removeEventListener("copy", onCopy);
      document.body.removeChild(wrapper);
      selection.removeAllRanges();
      if (ok) resolve();
      else reject(new Error("Copy failed"));
    }).catch(function () {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        return navigator.clipboard.write([
          new ClipboardItem({
            "text/html": new Blob([html], { type: "text/html" }),
            "text/plain": new Blob([plain], { type: "text/plain" }),
          }),
        ]);
      }
      throw new Error("Copy failed");
    });
  }

  function notifySuccess(section) {
    var label = "Payment sheet";
    if (section === "farmers") label = "Farmer milk summary";
    else if (section === "summary") label = "Payment summary";
    var msg = label + " copied. Paste into Excel with Ctrl+V.";
    if (typeof Swal !== "undefined") {
      Swal.fire({ icon: "success", title: "Copied", text: msg, timer: 2200, showConfirmButton: false });
      return;
    }
    if (typeof window.appAlert === "function") {
      window.appAlert(msg, { icon: "success", title: "Copied" });
    }
  }

  function notifyError() {
    if (typeof Swal !== "undefined") {
      Swal.fire({ icon: "error", title: "Could not copy", text: "Try again or use Print." });
      return;
    }
    if (typeof window.appAlert === "function") {
      window.appAlert("Could not copy payment sheet.", { icon: "error", title: "Error" });
    }
  }

  document.querySelectorAll(".js-copy-point-payslip").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var section = btn.getAttribute("data-copy-section") || "full";
      var payload = buildCopyPayload(section);
      if (!payload) {
        notifyError();
        return;
      }
      copyRichContent(payload.html, payload.plain, payload.fragmentHtml)
        .then(function () { notifySuccess(section); })
        .catch(notifyError);
    });
  });
})();
</script>
