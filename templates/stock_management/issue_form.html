{% extends "base.html" %}
{% block title %}Issue Stock{% endblock %}
{% block page_heading %}Issue Stock{% endblock %}
{% block content %}
<div class="module-shell">
  <div class="page-header">
    <div>
      <h1 class="page-title">Issue Stock</h1>
      <p class="page-subtitle">Issue branch stock to farmers or collection points.</p>
    </div>
  </div>
  <div class="module-card form-shell">
    <div class="module-card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Issue</button>
        <a href="{% url 'stock-overview' %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
