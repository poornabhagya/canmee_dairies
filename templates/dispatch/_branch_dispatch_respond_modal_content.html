<div class="modal-header">
  <h5 class="modal-title" id="branchDispatchRespondModalLabel">Branch dispatch response</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form method="post" id="branchDispatchRespondForm" action="{{ form_action }}" class="branch-dispatch-respond-form">
  {% csrf_token %}
  <input type="hidden" name="embed" value="1">
  <input type="hidden" name="redirect_query" value="{{ redirect_query }}">
  <div class="modal-body">
    <div id="branchDispatchRespondErrors" class="alert alert-danger d-none" role="alert"></div>
    {% include "dispatch/_branch_dispatch_respond_fields.html" %}
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary">Submit response</button>
  </div>
</form>
