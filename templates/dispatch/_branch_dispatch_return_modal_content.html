<div class="modal-header">
  <h5 class="modal-title" id="branchDispatchRespondModalLabel">Accept branch return</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form method="post" id="branchDispatchReturnForm" action="{{ form_action }}" class="branch-dispatch-return-form">
  {% csrf_token %}
  <input type="hidden" name="embed" value="1">
  <input type="hidden" name="redirect_query" value="{{ redirect_query }}">
  <div class="modal-body">
    <div id="branchDispatchReturnErrors" class="alert alert-danger d-none" role="alert"></div>
    {% include "dispatch/_branch_dispatch_return_fields.html" %}
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary">Save decision</button>
  </div>
</form>
