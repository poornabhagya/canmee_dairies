{% extends "base.html" %}
{% block title %}Reset password · Canmee Dairies{% endblock %}
{% block content %}
<div class="auth-card">
  <h1 class="h4 mb-1">Reset password</h1>
  <p class="text-muted small mb-4">We will email you a link to choose a new password.</p>
  <form method="post" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary w-100 mt-2">Send link</button>
  </form>
  <p class="text-center small mt-3 mb-0"><a href="{% url 'login' %}">Back to sign in</a></p>
</div>
{% endblock %}
