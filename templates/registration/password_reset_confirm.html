{% extends "base.html" %}
{% block title %}New password · Canmee Dairies{% endblock %}
{% block content %}
<div class="auth-card">
  <h1 class="h4 mb-1">Set new password</h1>
  <p class="text-muted small mb-4">Choose a password for your account.</p>
  <form method="post" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary w-100 mt-2">Save password</button>
  </form>
</div>
{% endblock %}
