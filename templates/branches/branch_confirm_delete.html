{% extends "base.html" %}
{% block title %}Delete branch · Canmee Dairies{% endblock %}
{% block page_heading %}Delete branch{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h5 class="mb-2">Delete branch {{ object }}?</h5>
    <p class="text-muted">This action cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a href="{% url 'branch-list' %}" class="btn btn-outline-secondary ms-1">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
