<script>
(function () {
  var PAGE_KEY = "canmee.pageLoading";
  var active = false;

  function markPageLoading(meta) {
    try {
      sessionStorage.setItem(
        PAGE_KEY,
        JSON.stringify(Object.assign({ t: Date.now(), pct: 35 }, meta || {}))
      );
    } catch (e) {
      /* ignore */
    }
  }

  function clearPageLoadingMark() {
    try {
      sessionStorage.removeItem(PAGE_KEY);
    } catch (e) {
      /* ignore */
    }
  }

  function ensureLoaderEl() {
    return document.getElementById("app-page-loader");
  }

  function hideOutboundLoader() {
    active = false;
    var el = ensureLoaderEl();
    if (!el) return;
    if (el._appLoaderTimer) {
      window.clearInterval(el._appLoaderTimer);
      el._appLoaderTimer = null;
    }
    if (el._appLoaderWatchdog) {
      window.clearTimeout(el._appLoaderWatchdog);
      el._appLoaderWatchdog = null;
    }
    el.hidden = true;
    el.setAttribute("aria-busy", "false");
  }

  function showOutboundLoader(title) {
    var el = ensureLoaderEl();
    if (!el) return;
    var titleEl = document.getElementById("app-page-loader-title");
    var bar = document.getElementById("app-page-loader-bar");
    var pctEl = document.getElementById("app-page-loader-pct");
    var statusEl = document.getElementById("app-page-loader-status");
    if (titleEl) titleEl.textContent = title || "Loading…";
    if (statusEl) statusEl.textContent = "Loading page…";
    if (bar) {
      bar.style.width = "35%";
      if (bar.parentElement) bar.parentElement.setAttribute("aria-valuenow", "35");
    }
    if (pctEl) pctEl.textContent = "35%";
    el.hidden = false;
    el.setAttribute("aria-busy", "true");
    active = true;

    var pct = 35;
    if (el._appLoaderTimer) window.clearInterval(el._appLoaderTimer);
    el._appLoaderTimer = window.setInterval(function () {
      if (!active) return;
      pct = Math.min(92, pct + 8);
      if (bar) {
        bar.style.width = pct + "%";
        if (bar.parentElement) {
          bar.parentElement.setAttribute("aria-valuenow", String(Math.round(pct)));
        }
      }
      if (pctEl) pctEl.textContent = Math.round(pct) + "%";
    }, 100);

    // If navigation is cancelled/stopped, the overlay would otherwise stick at ~90%.
    if (el._appLoaderWatchdog) window.clearTimeout(el._appLoaderWatchdog);
    var startHref = window.location.href;
    el._appLoaderWatchdog = window.setTimeout(function () {
      if (
        active &&
        window.location.href === startHref &&
        document.readyState === "complete"
      ) {
        hideOutboundLoader();
        clearPageLoadingMark();
      }
    }, 2500);
  }

  function beginPageLoad(options) {
    options = options || {};
    var title = options.title || "Loading…";
    markPageLoading({ title: title, pct: 55 });
    showOutboundLoader(title);
    if (typeof options.navigateFn === "function") {
      // Navigate immediately — do not wait on the progress animation.
      options.navigateFn();
    }
  }

  function linkTitle(link) {
    if (link.dataset.loadTitle) return link.dataset.loadTitle;
    var text = (link.textContent || "").replace(/\s+/g, " ").trim();
    if (text && text.length <= 48) return "Loading " + text + "…";
    return "Loading…";
  }

  function shouldHandleLink(link) {
    if (!link || !link.getAttribute) return false;
    if (link.dataset.noPageLoader === "1") return false;
    if (link.classList.contains("js-payment-sheet-load-progress")) return false;
    if (link.classList.contains("js-swal-delete-post")) return false;
    if (link.classList.contains("js-asset-type-delete")) return false;
    if (link.classList.contains("js-asset-location-delete")) return false;
    if (link.classList.contains("js-swal-delete")) return false;
    if (link.classList.contains("dropdown-toggle")) return false;
    if (link.hasAttribute("download")) return false;
    if (link.target && link.target !== "_self") return false;
    var href = link.getAttribute("href");
    if (!href || href === "#" || href.indexOf("javascript:") === 0) return false;
    var url;
    try {
      url = new URL(href, window.location.origin);
    } catch (e) {
      return false;
    }
    if (url.origin !== window.location.origin) return false;
    if (/\/(?:quick-)?delete\/?$/i.test(url.pathname)) return false;
    if (
      url.pathname === window.location.pathname &&
      url.search === window.location.search
    ) {
      // Same page (hash-only or identical) — skip.
      return false;
    }
    return true;
  }

  function shouldHandleForm(form) {
    if (!form || form.dataset.noPageLoader === "1") return false;
    if (form.dataset.progressSubmitting === "1") return false;
    if (form.classList.contains("payment-sheet-filter-form")) return false;
    if (form.id === "periodPaymentForm") return false;
    if (form.id === "payment-sheet-bulk-pay-form") return false;
    if (form.target && form.target !== "_self") return false;
    var method = (form.getAttribute("method") || "get").toLowerCase();
    if (method !== "get" && method !== "post") return false;
    return true;
  }

  document.addEventListener("click", function (event) {
    if (event.defaultPrevented) return;
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    if (event.button != null && event.button !== 0) return;
    var link = event.target.closest && event.target.closest("a[href]");
    if (!shouldHandleLink(link)) return;
    beginPageLoad({
      title: linkTitle(link),
    });
  });

  document.addEventListener("submit", function (event) {
    if (event.defaultPrevented) return;
    var form = event.target;
    if (!shouldHandleForm(form)) return;
    var submitter = event.submitter;
    var title =
      (submitter && (submitter.dataset.loadTitle || submitter.textContent)) ||
      form.dataset.loadTitle ||
      "Loading…";
    title = String(title).replace(/\s+/g, " ").trim();
    if (title.length > 48) title = "Loading…";
    else if (title && title !== "Loading…") title = "Loading " + title + "…";
    beginPageLoad({ title: title });
  });

  // Browser back/forward restores a frozen page (bfcache) with the outbound
  // loader still visible — load does not fire again, so clear it here.
  window.addEventListener("pageshow", function (event) {
    if (event.persisted || active) {
      hideOutboundLoader();
      clearPageLoadingMark();
    }
  });

  // If navigation is aborted (Esc / stop / cancel), drop the overlay.
  window.addEventListener("pagehide", function (event) {
    if (event.persisted) {
      // Leaving into bfcache: keep DOM as-is; pageshow will clear on return.
      return;
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && active) {
      // Soft recovery if a navigation was cancelled while overlay was up.
      window.setTimeout(function () {
        if (active && document.visibilityState === "visible") {
          hideOutboundLoader();
          clearPageLoadingMark();
        }
      }, 400);
    }
  });

  window.markPageLoading = markPageLoading;
  window.beginPageLoad = beginPageLoad;
  window.hidePageLoad = hideOutboundLoader;
})();
</script>
