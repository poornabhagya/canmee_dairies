<div id="inline-qty-actions" class="inline-qty-actions" hidden role="toolbar" aria-label="Save or cancel edit">
  <div class="inline-qty-actions__panel">
    <button type="button" class="inline-qty-save" title="Save" aria-label="Save">
      <i class="bi bi-check-lg"></i>
    </button>
    <button type="button" class="inline-qty-cancel" title="Cancel" aria-label="Cancel">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  <div class="inline-qty-actions__arrow" aria-hidden="true"></div>
</div>
