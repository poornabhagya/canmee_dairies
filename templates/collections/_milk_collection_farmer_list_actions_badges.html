<div class="smart-badge-row" role="group" aria-label="Row actions">
  {% if o.source == 'farmer' and o.farmer_id and o.farmer.collection_point %}
  <a
    href="{% url 'farmer-receipt-period' o.farmer.collection_point.pk o.farmer.pk %}?from={{ o.date|date:'Y-m-d' }}&amp;to={{ o.date|date:'Y-m-d' }}"
    target="_blank"
    rel="noopener noreferrer"
    class="smart-badge smart-badge--print-receipts"
  >Receipt</a>
  {% endif %}
  {% if perms.collections.view_milkcollectionadjustment %}
  <a
    href="{% url 'milk-collection-adjustments' o.pk %}"
    class="smart-badge smart-badge--print-summary"
    title="Kg add/subtract history"
  >History</a>
  {% endif %}
  {% if perms.collections.change_milkcollection %}
  <a href="{% url 'milk-collection-edit' o.pk %}" class="smart-badge smart-badge--secondary">Edit</a>
  {% endif %}
</div>
